name: Update forecast and publish Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    # Reconcile age every five minutes; a real collection is still gated at 35 min.
    # GitHub schedules can be delayed/dropped, so every check reconciles age.
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    outputs:
      refresh: ${{ steps.freshness.outputs.refresh }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check publication age
        id: freshness
        run: python scripts/check_refresh.py --force "${{ github.event_name != 'schedule' }}" --github-output "$GITHUB_OUTPUT"
      - name: Validate code before collecting
        if: steps.freshness.outputs.refresh == 'true'
        run: python -m unittest discover -s tests -v
      - name: Test browser reliability without network
        if: steps.freshness.outputs.refresh == 'true'
        run: |
          node tests/web_reliability.cjs
          node tests/dashboard_behavior.cjs
          node tests/publication_refresh.cjs
          node tests/forecast_contract.cjs
      - name: Fetch live forecast and build static site
        if: steps.freshness.outputs.refresh == 'true'
        env:
          INMET_API_TOKEN: ${{ secrets.INMET_API_TOKEN }}
          CEMADEN_PED_EMAIL: ${{ secrets.CEMADEN_PED_EMAIL }}
          CEMADEN_PED_PASSWORD: ${{ secrets.CEMADEN_PED_PASSWORD }}
          CEMADEN_PED_TOKEN: ${{ secrets.CEMADEN_PED_TOKEN }} # Legacy fallback only
        run: python scripts/build_site.py --output dist --previous-url https://guimig.github.io/criseclimatica/
      - name: Verify dataset integrity
        if: steps.freshness.outputs.refresh == 'true'
        run: python scripts/validate_site.py --output dist
      - name: Configure GitHub Pages
        if: steps.freshness.outputs.refresh == 'true'
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        if: steps.freshness.outputs.refresh == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: needs.build.outputs.refresh == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
