name: Update forecast and publish Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    # Two collections per hour, every day, away from the hour boundary.
    # Each delivered event collects; GitHub may still delay/drop scheduled events.
    - cron: '7,37 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    outputs:
      refresh: ${{ steps.freshness.outputs.refresh }}
      artifact_name: github-pages-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect on every trigger
        id: freshness
        run: python scripts/check_refresh.py --force true --github-output "$GITHUB_OUTPUT"
      - name: Validate code before collecting
        if: steps.freshness.outputs.refresh == 'true'
        run: python -m unittest discover -s tests -v
      - name: Test browser reliability without network
        if: steps.freshness.outputs.refresh == 'true'
        run: |
          node tests/web_reliability.cjs
          node tests/dashboard_behavior.cjs
          node tests/publication_refresh.cjs
          node tests/forecast_contract.cjs
      - name: Fetch live forecast and build static site
        if: steps.freshness.outputs.refresh == 'true'
        env:
          INMET_API_TOKEN: ${{ secrets.INMET_API_TOKEN }}
          CEMADEN_PED_EMAIL: ${{ secrets.CEMADEN_PED_EMAIL }}
          CEMADEN_PED_PASSWORD: ${{ secrets.CEMADEN_PED_PASSWORD }}
          CEMADEN_PED_TOKEN: ${{ secrets.CEMADEN_PED_TOKEN }} # Legacy fallback only
        run: python scripts/build_site.py --output dist --previous-url https://guimig.github.io/criseclimatica/
      - name: Verify dataset integrity
        if: steps.freshness.outputs.refresh == 'true'
        run: python scripts/validate_site.py --output dist
      - name: Configure GitHub Pages
        if: steps.freshness.outputs.refresh == 'true'
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        if: steps.freshness.outputs.refresh == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: dist
  deploy:
    if: needs.build.outputs.refresh == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}
