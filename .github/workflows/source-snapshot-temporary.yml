name: Temporary source snapshot
on:
  push:
    branches: [feat/cemaden-sensores-municipios-vale-itajai]
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: source-snapshot-for-qa
          path: |
            .github/workflows
            README.md
            docs
            config
            src
            scripts
            tests
            web
            pyproject.toml
          retention-days: 1
